spring:
  application:
    name: hrgenius-backend

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:hrgenius}
    password: ${DB_PASSWORD:hrgenius}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: HrGeniusHikari

  jpa:
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never Hibernate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        jdbc:
          batch_size: 30
          time_zone: UTC                           # store all instants in UTC
        default_batch_fetch_size: 30   # mitigates N+1 on lazy collections
        format_sql: false
        # Pin type mappings so schema validation doesn't depend on the Oracle version
        # (Oracle 23 has a native BOOLEAN; our DDL uses NUMBER(1) and plain TIMESTAMP).
        type:
          preferred_boolean_jdbc_type: BIT         # -> NUMBER(1,0) on Oracle
          preferred_instant_jdbc_type: TIMESTAMP   # -> TIMESTAMP (no time zone)
    show-sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  mvc:
    format:
      # ISO dates for query/form parameters (Spring's default is locale-dependent).
      date: iso
      date-time: iso

  data:
    web:
      pageable:
        max-page-size: 100         # hard cap on list endpoint page size

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}          # MailHog SMTP
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  port: 8080
  servlet:
    context-path: /

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# ---- Application-specific settings ----
hrgenius:
  security:
    # In production supply these via env / secrets manager. Dev defaults below.
    jwt-secret: ${JWT_SECRET:change-me-in-prod-this-must-be-at-least-32-bytes-long-secret}
    jwt-issuer: hrgenius
    access-token-ttl-ms: ${ACCESS_TOKEN_TTL_MS:900000}          # 15 minutes
    refresh-token-ttl-ms: ${REFRESH_TOKEN_TTL_MS:604800000}     # 7 days
    encryption-key: ${FIELD_ENCRYPTION_KEY:dev-only-256-bit-field-encryption-key-01}
  storage:
    # Uploaded documents live here (a Docker volume in compose). Files are stored under
    # random UUID names; the original filename is kept only as metadata.
    root: ${STORAGE_ROOT:./data/files}
    allowed-content-types: application/pdf,image/png,image/jpeg,application/vnd.openxmlformats-officedocument.wordprocessingml.document
  alerts:
    hr-email: ${HR_ALERT_EMAIL:hr@hrgenius.com}
    from-email: ${MAIL_FROM:no-reply@hrgenius.com}
    document-expiry-days: 30                 # warn this many days before a document expires
    document-expiry-cron: "0 0 8 * * *"      # daily at 08:00
  leave:
    accrual-cron: "0 30 0 1 * *"             # 00:30 on the 1st of every month

logging:
  level:
    root: INFO
    com.hrgenius: DEBUG
    org.hibernate.SQL: WARN
