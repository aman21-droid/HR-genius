spring:
  application:
    name: hrgenius-backend

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:hrgenius}
    password: ${DB_PASSWORD:hrgenius}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: HrGeniusHikari

  jpa:
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never Hibernate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        jdbc:
          batch_size: 30
        default_batch_fetch_size: 30   # mitigates N+1 on lazy collections
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}          # MailHog SMTP
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  port: 8080
  servlet:
    context-path: /

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# ---- Application-specific settings ----
hrgenius:
  security:
    # In production supply these via env / secrets manager. Dev defaults below.
    jwt-secret: ${JWT_SECRET:change-me-in-prod-this-must-be-at-least-32-bytes-long-secret}
    jwt-issuer: hrgenius
    access-token-ttl-ms: ${ACCESS_TOKEN_TTL_MS:900000}          # 15 minutes
    refresh-token-ttl-ms: ${REFRESH_TOKEN_TTL_MS:604800000}     # 7 days
    encryption-key: ${FIELD_ENCRYPTION_KEY:dev-only-256-bit-field-encryption-key-01}

logging:
  level:
    root: INFO
    com.hrgenius: DEBUG
    org.hibernate.SQL: WARN
