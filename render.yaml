# Render Blueprint: one free web service running the API with the Angular app bundled in.
# Demo profile = in-memory H2 seeded with sample data; it resets on every restart/redeploy.
services:
  - type: web
    name: hrgenius
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: JWT_SECRET
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
